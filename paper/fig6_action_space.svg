<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision ceiling as the action space widens">
<defs><style>.lb{font:10px Georgia,serif;fill:#111418}.sm{font:8.4px Georgia,serif;fill:#5a626c}.ti{font:bold 9.5px Georgia,serif;fill:#111418}.vn{font:bold 11.5px Georgia,serif}.tick{font:8.4px Georgia,serif;fill:#5a626c}</style></defs>
<text class="ti" x="10" y="16">Energy available to a perfect chooser, as the facility is allowed to decide more</text>
<text class="sm" x="10" y="29">Each bar is an expected value of perfect information: the best single fixed choice against an oracle choosing per workload.</text>
<line x1="258.0" y1="44" x2="258.0" y2="254" stroke="#e8eaec" stroke-width=".7"/>
<text class="tick" x="258.0" y="268" text-anchor="middle">0%</text>
