<text class="sm" x="371.0" y="143">Grid'5000, the widest at 18 platforms</text>
<line x1="258" y1="44" x2="258" y2="254" stroke="#111418" stroke-width=".9"/>
<text class="sm" x="10" y="288">Reading downward is the recommendation: the lever a facility exercises once, at purchase, dominates the two it exercises continuously.</text>
