<svg viewBox="0 0 700 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Facility energy saving available from each lever">
<defs><style>.lb{font:10px Georgia,serif;fill:#111418}.sm{font:8.5px Georgia,serif;fill:#5a626c}.ti{font:bold 9.5px Georgia,serif;fill:#111418}.vn{font:bold 11px Georgia,serif}</style></defs>
<text class="ti" x="10" y="16">Facility energy saved by each lever, on identical replayed arrivals</text>
<line x1="214.0" y1="30" x2="214.0" y2="222" stroke="#e8eaec" stroke-width=".7"/>
<text class="sm" x="214.0" y="234" text-anchor="middle">0%</text>
<line x1="324.0" y1="30" x2="324.0" y2="222" stroke="#e8eaec" stroke-width=".7"/>
<text class="sm" x="324.0" y="234" text-anchor="middle">10%</text>
<line x1="434.0" y1="30" x2="434.0" y2="222" stroke="#e8eaec" stroke-width=".7"/>
<text class="sm" x="434.0" y="234" text-anchor="middle">20%</text>
<line x1="544.0" y1="30" x2="544.0" y2="222" stroke="#e8eaec" stroke-width=".7"/>
<text class="sm" x="544.0" y="234" text-anchor="middle">30%</text>
<text class="lb" x="204" y="56" text-anchor="end">Fleet composition</text>
<text class="sm" x="204" y="68" text-anchor="end">what the facility buys</text>
<rect x="214" y="44" width="377.3" height="19" fill="#14385c" opacity=".9"/>
<text class="vn" x="598.3" y="58" fill="#14385c">34.3%</text>
<text class="sm" x="216" y="77">best feasible mix against a throughput-first all-A100 purchase</text>
<text class="lb" x="204" y="102" text-anchor="end">Consolidation</text>
<text class="sm" x="204" y="114" text-anchor="end">letting idle machines sleep</text>
<rect x="214" y="90" width="145.2" height="19" fill="#3d6b4a" opacity=".9"/>
<text class="vn" x="366.2" y="104" fill="#3d6b4a">13.2%</text>
<text class="sm" x="216" y="123">300 s sleep threshold, 0.7 s of added delay</text>
<text class="lb" x="204" y="148" text-anchor="end">Placement, mixed fleet</text>
<text class="sm" x="204" y="160" text-anchor="end">where each job runs</text>
<rect x="214" y="136" width="104.5" height="19" fill="#8a5a1e" opacity=".9"/>
<text class="vn" x="325.5" y="150" fill="#8a5a1e">9.5%</text>
<text class="sm" x="216" y="169">five accelerator types; upper end of a 6.9 to 9.5 per cent range</text>
<text class="lb" x="204" y="194" text-anchor="end">Placement, uniform fleet</text>
<text class="sm" x="204" y="206" text-anchor="end">where each job runs</text>
<rect x="214" y="182" width="0.8" height="19" fill="#9aa2ab" opacity=".9"/>
<text class="vn" x="221.8" y="196" fill="#9aa2ab">0.0%</text>
<text class="sm" x="216" y="215">two types, no ranking can invert; exact optimal assignment adds 0.00</text>
<line x1="214" y1="30" x2="214" y2="222" stroke="#111418" stroke-width=".9"/>
</svg>